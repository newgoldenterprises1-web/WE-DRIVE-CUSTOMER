name: One-time pickup drop syntax fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Dart syntax and remove this workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/booking/pickup_drop_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_option = """  Widget optionCard(String title, String subtitle, IconData icon, bool selected, VoidCallback onTap) {\n    return InkWell(onTap: onTap, borderRadius: BorderRadius.circular(17), child: AnimatedContainer(duration: const Duration(milliseconds: 180), padding: const EdgeInsets.all(13), decoration: BoxDecoration(color: selected ? primary : Colors.white, borderRadius: BorderRadius.circular(17), border: Border.all(color: selected ? primary : border)), child: Row(children: <Widget>[Icon(icon, color: selected ? Colors.white : primary, size: 22), const SizedBox(width: 9), Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: <Widget>[Text(title, style: TextStyle(color: selected ? Colors.white : primary, fontSize: 12, fontWeight: FontWeight.w800)), const SizedBox(height: 2), Text(subtitle, style: TextStyle(color: selected ? Colors.white70 : Colors.grey.shade600, fontSize: 10.5))]))]));\n  }"""
          new_option = """  Widget optionCard(String title, String subtitle, IconData icon, bool selected, VoidCallback onTap) {\n    return InkWell(\n      onTap: onTap,\n      borderRadius: BorderRadius.circular(17),\n      child: AnimatedContainer(\n        duration: const Duration(milliseconds: 180),\n        padding: const EdgeInsets.all(13),\n        decoration: BoxDecoration(\n          color: selected ? primary : Colors.white,\n          borderRadius: BorderRadius.circular(17),\n          border: Border.all(color: selected ? primary : border),\n        ),\n        child: Row(\n          children: <Widget>[\n            Icon(icon, color: selected ? Colors.white : primary, size: 22),\n            const SizedBox(width: 9),\n            Expanded(\n              child: Column(\n                crossAxisAlignment: CrossAxisAlignment.start,\n                children: <Widget>[\n                  Text(\n                    title,\n                    style: TextStyle(\n                      color: selected ? Colors.white : primary,\n                      fontSize: 12,\n                      fontWeight: FontWeight.w800,\n                    ),\n                  ),\n                  const SizedBox(height: 2),\n                  Text(\n                    subtitle,\n                    style: TextStyle(\n                      color: selected ? Colors.white70 : Colors.grey.shade600,\n                      fontSize: 10.5,\n                    ),\n                  ),\n                ],\n              ),\n            ),\n          ],\n        ),\n      ),\n    );\n  }"""

          old_connector = """  Widget routeConnector() => Padding(padding: const EdgeInsets.only(left: 17), child: Align(alignment: Alignment.centerLeft, child: Container(height: 14, width: 2, decoration: BoxDecoration(color: border, borderRadius: BorderRadius.circular(2))));"""
          new_connector = """  Widget routeConnector() {\n    return Padding(\n      padding: const EdgeInsets.only(left: 17),\n      child: Align(\n        alignment: Alignment.centerLeft,\n        child: Container(\n          height: 14,\n          width: 2,\n          decoration: BoxDecoration(\n            color: border,\n            borderRadius: BorderRadius.circular(2),\n          ),\n        ),\n      ),\n    );\n  }"""

          if old_option not in text:
              raise SystemExit('Expected optionCard snippet not found')
          if old_connector not in text:
              raise SystemExit('Expected routeConnector snippet not found')

          text = text.replace(old_option, new_option, 1)
          text = text.replace(old_connector, new_connector, 1)
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/one_time_pickup_drop_syntax_fix.yml').unlink()
        
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/booking/pickup_drop_screen.dart .github/workflows/one_time_pickup_drop_syntax_fix.yml
          git commit -m "Fix pickup drop Dart syntax"
          git push origin main
